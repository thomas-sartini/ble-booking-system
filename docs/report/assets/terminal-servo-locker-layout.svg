    text{font-family:Arial,Helvetica,sans-serif;fill:#283749}
    .heading{font-size:18px;font-weight:700}.sub{font-size:12px;fill:#687c91}.legend{font-size:12.5px}
    .tag{fill:#e6802a;stroke:#fff;stroke-width:2}.num{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .line{stroke:#e6802a;stroke-width:1.5;fill:none}
  </style></defs>
