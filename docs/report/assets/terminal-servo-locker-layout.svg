    <text x="65" y="524">1  Door with locker number</text><text x="65" y="543">2  Optional display mounted on cover</text>
    <text x="65" y="562">3  Window aligned with Nano status LED</text><text x="65" y="581">4  Removable electronics cover</text>
    <text x="65" y="600">5  Printed hinges</text>
    <text x="570" y="524">6  Nano on breadboard, behind status window</text><text x="570" y="543">7  Clock on separate mount</text>
    <text x="570" y="562">8  Servo and latch fixed to frame</text><text x="570" y="581">9  5 V distribution and Nano USB outlet</text>
