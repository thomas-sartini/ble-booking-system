<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1280" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Servo locker front and proposed mounting layout</title>
  <desc id="desc">Both views look from the front. The right view omits the door and cover. The Nano sits on a breadboard near the status window, above the servo. The clock and power socket have separate mounts. This is a mounting proposal, not a measured CAD design or wiring diagram.</desc>
  <metadata>Document date: 2026-10-14. Enclosure appearance adapted from terminal-locker-concept.svg. Servo mounting proposal; latch movement is shown in terminal-servo-latch-states.svg.</metadata>
