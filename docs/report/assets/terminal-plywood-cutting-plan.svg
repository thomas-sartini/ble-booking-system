<text x="40" y="828" class="small">Final hinge and latch fit follows the test piece. Holes and the divider cutout are separate workshop operations.</text>
<text x="40" y="852" class="small">Small-panel cutting, especially the 41 mm cover, must be agreed with the workshop. Printed fittings and screws are handled separately.</text>
