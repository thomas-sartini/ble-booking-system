<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1760" viewBox="0 0 1100 880" role="img" aria-labelledby="title desc">
<title id="title">Eight plywood panels from one 600 by 600 mm sheet</title>
<desc id="desc">A dimensioned nesting plan for 6 mm plywood. A 222 mm strip contains the back and two sides. A 210 mm strip contains the divider, door and electronics cover. A 140 mm strip contains the top and bottom. Saw allowances are 4 mm. The front panels are trimmed to 206 mm high. All eight panels fit with offcuts remaining. Dimensions assume nominal material thickness; drilling and latch openings are separate assembly operations.</desc>
