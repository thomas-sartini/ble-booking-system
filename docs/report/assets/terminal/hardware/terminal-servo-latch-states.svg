<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Servo latch: locked, released and side-section principle</title>
  <desc id="desc">Two views from the same direction show a fixed servo rotating a short latch out of an open door hook. In the locked view the latch extends left into the hook. In the released view it points upwards within the fixed bracket and clears the hook. A side section below shows the moving hook lip behind the stationary latch, so the lip meets the latch when the door is pulled outwards. Drawings are conceptual and not dimensioned.</desc>
  <metadata>Document date: 2026-10-14. Proposed demonstration mechanism; no CAD fit or load validation implied.</metadata>
  <defs>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#293d50}.heading{font-size:18px;font-weight:700}.label{font-size:13px}.small{font-size:12px;fill:#60788e}.callout{fill:none;stroke:#6d859b;stroke-width:1.3}.latch{fill:#edb94e;stroke:#a67622;stroke-width:1.5}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#c67e27"/></marker>
    <pattern id="hookHatch" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6 L6 0" stroke="#427faa" stroke-width="1"/></pattern>
  </defs>
  <rect width="1000" height="600" fill="#fff"/>
  <text x="35" y="33" class="heading">Locked</text>
  <text x="535" y="33" class="heading">Released</text>
  <text x="35" y="55" class="small">Front cutaway · latch seated in the open hook</text>
  <text x="535" y="55" class="small">Same view · latch rotated clear of the hook</text>
  <!-- Fixed and moving parts use the same geometry in both panels. -->
  <g id="locked">
    <rect x="35" y="79" width="246" height="257" rx="4" fill="#e9f1f9"/>
    <rect x="297" y="79" width="165" height="257" rx="4" fill="#e2e8ee"/>
    <text x="55" y="105" class="label">Door — moves</text>
    <text x="311" y="105" class="label">Bracket — fixed</text>
    <path d="M255 204 H279 V246 H239 V238 H255 Z" fill="#8bb1ce" stroke="#427faa"/>
    <rect x="255" y="204" width="24" height="42" fill="url(#hookHatch)"/>
    <rect x="320" y="204" width="89" height="46" rx="4" fill="#3d779d" stroke="#285575"/>
    <text x="387" y="234" text-anchor="middle" style="font-size:10px;fill:#fff" transform="rotate(-90 387 234)">MG90S</text>
    <circle cx="340" cy="225" r="24" fill="#c5cfd8" stroke="#8799a9"/>
    <rect x="303" y="232" width="24" height="8" fill="#7d91a3"/>
    <rect x="255" y="219" width="85" height="12" rx="4" class="latch"/>
    <circle cx="340" cy="225" r="9" class="latch"/><circle cx="340" cy="225" r="3" fill="#fff"/>
    <path d="M265 203 L223 153 H90 M305 225 L266 286 H181 M320 238 L330 302 H388" class="callout"/>
    <text x="55" y="148" class="label">Open hook on door</text>
    <text x="55" y="291" class="label">Printed latch</text>
    <text x="349" y="319" class="small">Printed stop</text>
  </g>
  <g id="released" transform="translate(500 0)">
    <rect x="35" y="79" width="246" height="257" rx="4" fill="#e9f1f9"/>
    <rect x="297" y="79" width="165" height="257" rx="4" fill="#e2e8ee"/>
    <text x="55" y="105" class="label">Door — moves</text><text x="311" y="105" class="label">Bracket — fixed</text>
    <path d="M255 204 H279 V246 H239 V238 H255 Z" fill="#8bb1ce" stroke="#427faa"/>
    <rect x="255" y="204" width="24" height="42" fill="url(#hookHatch)"/>
    <rect x="320" y="204" width="89" height="46" rx="4" fill="#3d779d" stroke="#285575"/>
    <text x="387" y="234" text-anchor="middle" style="font-size:10px;fill:#fff" transform="rotate(-90 387 234)">MG90S</text>
    <circle cx="340" cy="225" r="24" fill="#c5cfd8" stroke="#8799a9"/>
    <rect x="303" y="232" width="24" height="8" fill="#7d91a3"/>
    <rect x="334" y="140" width="12" height="85" rx="4" class="latch"/>
    <circle cx="340" cy="225" r="9" class="latch"/><circle cx="340" cy="225" r="3" fill="#fff"/>
    <path d="M285 197 A62 62 0 0 1 313 166" stroke="#c67e27" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="58" y="295" class="label">Hook and latch no longer overlap.</text>
    <text x="58" y="316" class="small">Set the actual angles on the test piece.</text>
  </g>
  <path d="M35 361 H965" stroke="#d4dfe8"/>
  <text x="35" y="392" class="heading">Why it holds the door · side section at the hook</text>
  <!-- Outside is left, inside right. The hook lip moves left into the fixed latch when pulled. -->
  <rect x="119" y="419" width="13" height="103" fill="#507eac"/>
  <path d="M132 491 H271 V434 H259 V479 H132 Z" fill="#8bb1ce" stroke="#427faa"/>
  <rect x="219" y="435" width="14" height="38" class="latch"/>
  <path d="M226 435 V418 H301" stroke="#7d91a3" stroke-width="7" fill="none"/>
  <path d="M112 459 H59" stroke="#c67e27" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="36" y="551" class="small">Pull outwards</text>
  <path d="M264 464 H342 M226 451 L328 451" class="callout"/>
  <text x="351" y="433" class="label">Yellow: fixed latch in its locked position</text>
  <text x="351" y="458" class="label">Blue: hook fixed to the moving door</text>
  <text x="351" y="490" class="small">The rear lip of the hook meets the latch when the door is pulled.</text>
  <text x="351" y="513" class="small">Rotating the latch upwards clears the hook before opening.</text>
  <text x="35" y="582" class="small">Mechanism proposal · not to scale · check the guide, hook opening and full movement path on a printed test piece.</text>
</svg>
