spring.application.name=backend
spring.config.import=optional:file:../.env[.properties]

# Server configuration
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:ble_booking_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Actuator - expose only health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT and authentication configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D

# Login throttling
app.auth.max-failed-attempts=5
app.auth.lockout-duration=PT15M

# CORS for web frontend
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Booking rules (docs/api/booking-api.md, decisions D1, D6-D9)
app.booking.zone=Europe/Zurich
app.booking.slot-minutes=30
app.booking.max-duration=PT4H
app.booking.horizon=P30D
app.booking.max-query-days=14

# Booking emails (docs/api/booking-api.md §6, backend/README.md "Booking emails")
# Mapped explicitly because ../.env is imported as a properties file, where SPRING_MAIL_HOST would not
# bind to spring.mail.host by itself. Empty username/password means no SMTP login (e.g. Mailpit).
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@ble-booking.local}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# An SMTP outage must not mark the API unhealthy (Railway health check): failed emails are retried instead.
management.health.mail.enabled=false

# Event publication registry: incomplete publications (e.g. failed emails) are re-submitted on restart
spring.modulith.events.republish-outstanding-events-on-restart=true
