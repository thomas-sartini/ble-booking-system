spring.application.name=backend
spring.config.import=optional:file:../.env[.properties]

# Server configuration
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:ble_booking_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Actuator - expose only health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT and authentication configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D

# Login throttling
app.auth.max-failed-attempts=5
app.auth.lockout-duration=PT15M

# CORS for web frontend
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
