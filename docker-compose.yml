services:
  postgres:
    image: postgres:16-alpine
    container_name: ble_booking_db_container
    environment:
      POSTGRES_DB: ble_booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
